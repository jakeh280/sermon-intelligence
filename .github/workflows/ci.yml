name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Without this a hung job inherits GitHub's six hour default. Every run of
    # this job to date finishes in under a minute, so 10 means stuck, not slow.
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint before the slower steps so a style failure costs seconds. Kept in this
      # job rather than a new one: a separate job allocates a second runner on every
      # push and PR, and the free Actions allowance is the binding constraint.
      - name: Lint
        run: npm run lint

      - name: Test analysis logic
        run: npm test

      - name: Build
        run: npm run build
